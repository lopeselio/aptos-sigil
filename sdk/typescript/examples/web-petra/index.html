<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/logo.png" />
    <title>Aptos Sigil - game-dev console</title>
    <meta name="description" content="Hybrid game-dev console for the Aptos Sigil platform - guided walkthrough + raw module tools, with gasless transactions." />
    <meta property="og:title" content="Aptos Sigil - game-dev console" />
    <meta property="og:description" content="Guided walkthrough + raw module tools for building games on Aptos, with gasless (sponsored) transactions." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/logo.png" />
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #0b1020; }
      /* Dark-theme the many raw (un-inline-styled) buttons/inputs in the technical tabs. */
      button:not([style*="background"]) {
        background: #2a3354; color: #e8ecf6; border: 1px solid #1d2746;
        border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
      }
      button:not([style*="background"]):hover { background: #34406b; }
      input:not([type="checkbox"]):not([style*="background"]) {
        background: #0b1020; color: #e8ecf6; border: 1px solid #2a3354; border-radius: 6px; padding: 5px 8px;
      }
      code, pre { color: #cdd6f4; }
      a { color: #8aa0ff; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

[package]
name = "sigil_v2"
version = "1.0.0"
authors = []

# `sigil` is left unassigned ("_") so the package can be published to any
# publisher/network via `--named-addresses sigil=<addr>` (testnet, mainnet, a
# fresh devnet account, …). Tests/compile resolve it from [dev-addresses] below,
# so `aptos move test` needs no extra flags.
[addresses]
sigil = "_"

[dev-addresses]
sigil = "0xe68ef23cb6316728ae3b0f3edcc96640219275c2ed62c405578cc486a12dfac6"


[dependencies.AptosFramework]
git = "https://github.com/aptos-labs/aptos-framework.git"
rev = "mainnet"
subdir = "aptos-framework"

[dependencies.AptosTokenObjects]
git = "https://github.com/aptos-labs/aptos-framework.git"
rev = "mainnet"
subdir = "aptos-token-objects"

[dev-dependencies]

name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: SDK (build · test · typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Typecheck examples
        run: npm run typecheck:examples

  web-petra:
    name: web-petra (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            sdk/typescript/examples/web-petra/package-lock.json

      # web-petra compiles the SDK source (../../../src) in place, so the SDK's
      # own deps (e.g. @aptos-labs/ts-sdk) must be installed too.
      - name: Install SDK deps
        working-directory: sdk/typescript
        run: npm ci

      - name: Install + build web-petra
        working-directory: sdk/typescript/examples/web-petra
        run: |
          npm ci
          npm run build

  move:
    name: Move (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Aptos CLI
        run: |
          curl -fsSL https://aptos.dev/scripts/install_cli.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show version
        run: aptos --version

      - name: Move unit tests
        run: aptos move test --package-dir move
